  <script>
/* 💣 Сапёр — открой все безопасные клетки, не попав на мину.
 *
 * Классический скрипт: без import/export, без зависимостей, работает по file://.
 * Регистрируется как window.Games.minesweeper и монтируется в переданный root.
 */
(function () {
  'use strict';

  var SIZE = 9;
  var MINES = 10;

  var RULES = [
    'Поле ' + SIZE + '×' + SIZE + ', мин: ' + MINES + '.',
    'Левый клик — открыть клетку, правый — поставить флажок 🚩.',
    'Цифра показывает, сколько мин рядом.',
    'Первый клик всегда безопасен.',
    'Открой все клетки без мин — победа. Попадёшь на мину — проигрыш.'
  ].join('\n');

  var NUM_COLORS = { 1: '#6ab3f3', 2: '#7fd39a', 3: '#f08b8b', 4: '#c58af9', 5: '#e0a33c', 6: '#4fd1c5', 7: '#e9eef3', 8: '#8b9bab' };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function call(fn, arg) {
    if (typeof fn === 'function') {
      try { return fn(arg); } catch (err) { return undefined; }
    }
    return undefined;
  }

  function mount(root, api) {
    api = api || {};
    root = root || document.body;
    root.innerHTML = '';

    var cells = [];
    var gridEl, statusEl, mineEl;
    var placed = false;
    var over = false;
    var openedSafe = 0;
    var flags = 0;

    function neighbors(idx) {
      var r = Math.floor(idx / SIZE);
      var c = idx % SIZE;
      var out = [];
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          var nr = r + dr;
          var nc = c + dc;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) out.push(nr * SIZE + nc);
        }
      }
      return out;
    }

    function reset() {
      cells = [];
      placed = false;
      over = false;
      openedSafe = 0;
      flags = 0;
      for (var i = 0; i < SIZE * SIZE; i++) {
        cells.push({ mine: false, revealed: false, flagged: false, adj: 0 });
      }
      render();
      statusEl.textContent = 'Первый клик — безопасный. Удачи!';
    }

    function placeMines(safeIdx) {
      var forbidden = {};
      forbidden[safeIdx] = true;
      neighbors(safeIdx).forEach(function (n) { forbidden[n] = true; });
      var pool = [];
      for (var i = 0; i < cells.length; i++) if (!forbidden[i]) pool.push(i);
      for (var m = pool.length - 1; m > 0; m--) {
        var j = Math.floor(Math.random() * (m + 1));
        var t = pool[m]; pool[m] = pool[j]; pool[j] = t;
      }
      for (var k = 0; k < MINES && k < pool.length; k++) cells[pool[k]].mine = true;
      for (var idx = 0; idx < cells.length; idx++) {
        var adj = 0;
        neighbors(idx).forEach(function (n) { if (cells[n].mine) adj += 1; });
        cells[idx].adj = adj;
      }
      placed = true;
    }

    function open(idx) {
      if (over) return;
      var cell = cells[idx];
      if (cell.revealed || cell.flagged) return;
      if (!placed) placeMines(idx);

      if (cell.mine) {
        cell.revealed = true;
        finish(false);
        return;
      }

      var stack = [idx];
      while (stack.length) {
        var cur = stack.pop();
        var c = cells[cur];
        if (c.revealed || c.flagged) continue;
        c.revealed = true;
        openedSafe += 1;
        if (c.adj === 0) {
          neighbors(cur).forEach(function (n) {
            if (!cells[n].revealed && !cells[n].flagged) stack.push(n);
          });
        }
      }
      render();
      if (openedSafe === cells.length - MINES) finish(true);
    }

    function toggleFlag(idx) {
      if (over) return;
      var cell = cells[idx];
      if (cell.revealed) return;
      cell.flagged = !cell.flagged;
      flags += cell.flagged ? 1 : -1;
      render();
    }

    function finish(win) {
      over = true;
      var coins = win ? 40 : 0;
      call(api.reward, win ? { coins: coins, win: true, points: 40 } : { lose: true });
      if (!win) {
        for (var i = 0; i < cells.length; i++) if (cells[i].mine) cells[i].revealed = true;
      }
      render();
      statusEl.textContent = win
        ? '🎉 Поле очищено! Награда: ' + coins + ' 🪙'
        : '💥 Взрыв! Попалась мина. Попробуй ещё раз.';
      if (win) call(api.toast, '🎉 +' + coins + ' 🪙');
    }

    function render() {
      mineEl.textContent = '🚩 ' + flags + ' / ' + MINES;
      gridEl.innerHTML = '';
      for (var i = 0; i < cells.length; i++) {
        (function (idx) {
          var c = cells[idx];
          var cell = el('button', 'gw-cell gw-ms-cell');
          cell.type = 'button';
          if (c.revealed) {
            cell.classList.add('gw-ms-open');
            if (c.mine) {
              cell.classList.add('gw-bad');
              cell.textContent = '💣';
            } else if (c.adj > 0) {
              cell.textContent = String(c.adj);
              cell.style.color = NUM_COLORS[c.adj] || '#e9eef3';
            }
          } else if (c.flagged) {
            cell.classList.add('gw-ok');
            cell.textContent = '🚩';
          }
          cell.addEventListener('click', function () { open(idx); });
          cell.addEventListener('contextmenu', function (event) {
            event.preventDefault();
            toggleFlag(idx);
          });
          gridEl.appendChild(cell);
        })(i);
      }
    }

    function buildShell() {
      root.appendChild(el('div', 'gw-title', '💣 Сапёр'));
      root.appendChild(el('div', 'gw-desc', 'Открой все безопасные клетки, не попав на мину.'));

      var row = el('div', 'gw-row');
      mineEl = el('span', 'gw-badge', '🚩 0 / ' + MINES);
      row.appendChild(mineEl);

      var newBtn = el('button', 'gw-btn gw-primary', '🔁 Новое поле');
      newBtn.type = 'button';
      newBtn.addEventListener('click', reset);
      row.appendChild(newBtn);

      var back = el('button', 'gw-btn gw-ghost', '↩ В меню');
      back.type = 'button';
      back.addEventListener('click', function () { call(api.back); });
      row.appendChild(back);
      root.appendChild(row);

      gridEl = el('div', 'gw-grid gw-ms');
      gridEl.addEventListener('contextmenu', function (event) { event.preventDefault(); });
      root.appendChild(gridEl);

      statusEl = el('div', 'gw-status', '');
      root.appendChild(statusEl);

      root.appendChild(el('div', 'gw-desc', RULES));
    }

    buildShell();
    reset();

    return {
      destroy: function () {
        root.innerHTML = '';
      }
    };
  }

  window.Games = window.Games || {};
  window.Games.minesweeper = {
    key: 'minesweeper',
    emoji: '💣',
    title: 'Сапёр',
    description: '9×9, 10 мин — открой безопасные клетки',
    rules: RULES,
    mount: mount
  };
})();

  <script>
/**
 * Каркас веб-версии «Игрового зала»: меню, монеты, статистика, рейтинг, справка.
 * Сами игры лежат в отдельных файлах и регистрируются в window.Games.
 */
(function () {
  'use strict';

  var STORE_KEY = 'games-web-state-v1';
  var START_COINS = 100;

  var state = loadState();
  var currentGame = null;      // { def, instance }
  var viewEl = document.getElementById('gw-view');
  var balanceEl = document.getElementById('gw-balance');
  var playerEl = document.getElementById('gw-player');
  var toastsEl = document.getElementById('gw-toasts');

  // ---------- хранилище ----------

  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    var parsed = null;
    if (raw) { try { parsed = JSON.parse(raw); } catch (e) { parsed = null; } }
    if (!parsed || typeof parsed !== 'object' || !parsed.players) {
      parsed = { current: 'Игрок', players: {} };
    }
    if (!parsed.current || !parsed.players[parsed.current]) {
      parsed.current = Object.keys(parsed.players)[0] || 'Игрок';
      parsed.players[parsed.current] = parsed.players[parsed.current] || newPlayer();
    }
    return parsed;
  }

  function newPlayer() {
    return { coins: START_COINS, created: Date.now(), stats: {} };
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* приватный режим */ }
  }

  function player() {
    var p = state.players[state.current];
    if (!p) { p = newPlayer(); state.players[state.current] = p; }
    if (!p.stats) p.stats = {};
    return p;
  }

  function statFor(key) {
    var p = player();
    if (!p.stats[key]) p.stats[key] = { played: 0, wins: 0, losses: 0, points: 0, best: 0 };
    return p.stats[key];
  }

  // ---------- утилиты ----------

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function toast(text) {
    var t = el('div', 'gw-toast', text);
    toastsEl.appendChild(t);
    setTimeout(function () {
      t.style.opacity = '0';
      t.style.transition = 'opacity .25s ease';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 280);
    }, 2600);
  }

  function updateChrome() {
    balanceEl.textContent = '🪙 ' + player().coins;
    if (document.activeElement !== playerEl) playerEl.value = state.current;
  }

  // ---------- игры ----------

  function gameList() {
    var reg = window.Games || {};
    return Object.keys(reg)
      .map(function (k) { return reg[k]; })
      .filter(function (g) { return g && typeof g.mount === 'function'; })
      .sort(function (a, b) { return String(a.title).localeCompare(String(b.title), 'ru'); });
  }

  function api(key) {
    return {
      balance: function () { return player().coins; },
      spend: function (n) {
        n = Math.max(0, Math.round(n || 0));
        var p = player();
        if (p.coins < n) { toast('Недостаточно монет: нужно ' + n + ' 🪙'); return false; }
        p.coins -= n; save(); updateChrome();
        return true;
      },
      reward: function (opts) {
        opts = opts || {};
        var p = player();
        var st = statFor(key);
        var coins = Math.round(opts.coins || 0);
        var points = Math.round(opts.points || 0);
        if (coins) p.coins += coins;
        if (opts.win || opts.lose) st.played += 1;
        if (opts.win) { st.wins += 1; st.points += points; }
        if (opts.lose) { st.losses += 1; }
        if (points > st.best) st.best = points;
        save(); updateChrome();
        if (coins) toast((coins > 0 ? '+' : '') + coins + ' 🪙');
      },
      toast: toast,
      back: showMenu
    };
  }

  function openGame(def) {
    destroyGame();
    clear(viewEl);

    var head = el('div', 'gw-row');
    var title = el('h2', 'gw-title', (def.emoji ? def.emoji + ' ' : '') + def.title);
    var back = el('button', 'gw-btn gw-ghost gw-right', '↩ В меню');
    back.addEventListener('click', showMenu);
    head.appendChild(title);
    head.appendChild(back);

    if (def.description) head.appendChild(el('span', 'gw-badge', def.description));
    viewEl.appendChild(head);

    var root = el('div', 'gw-panel');
    viewEl.appendChild(root);

    var instance = null;
    try {
      instance = def.mount(root, api(def.key || def.title));
    } catch (err) {
      root.appendChild(el('p', 'gw-desc', 'Игра не запустилась: ' + (err && err.message ? err.message : err)));
      if (window.console) console.error(err);
    }
    currentGame = { def: def, instance: instance };
    updateChrome();
  }

  function destroyGame() {
    if (currentGame && currentGame.instance && typeof currentGame.instance.destroy === 'function') {
      try { currentGame.instance.destroy(); } catch (e) { /* не мешаем выходу */ }
    }
    currentGame = null;
  }

  // ---------- виды ----------

  function showMenu() {
    destroyGame();
    clear(viewEl);
    viewEl.appendChild(el('h2', 'gw-title', 'Игры'));
    viewEl.appendChild(el('p', 'gw-desc', 'Выберите игру. Монеты за победы, статистика и рейтинг — сверху.'));

    var list = gameList();
    if (!list.length) {
      viewEl.appendChild(el('p', 'gw-desc', 'Файлы игр не загрузились — проверьте, что рядом лежат *.js игры.'));
      return;
    }
    var menu = el('div', 'gw-menu');
    list.forEach(function (def) {
      var card = el('button', 'gw-card');
      card.type = 'button';
      card.appendChild(el('div', 'gw-card-emoji', def.emoji || '🎲'));
      card.appendChild(el('div', 'gw-card-title', def.title || def.key));
      card.appendChild(el('div', 'gw-card-desc', def.description || ''));
      card.addEventListener('click', function () { openGame(def); });
      menu.appendChild(card);
    });
    viewEl.appendChild(menu);
    updateChrome();

  function showStats() {
    destroyGame();
    clear(viewEl);
    var p = player();
    viewEl.appendChild(el('h2', 'gw-title', '📊 Статистика — ' + state.current));

    var panel = el('div', 'gw-panel');
    panel.appendChild(el('p', 'gw-desc', 'Монет: ' + p.coins + ' 🪙'));

    var table = el('table', 'gw-table');
    var thead = el('thead');
    var hr = el('tr');
    ['Игра', 'Партий', 'Побед', 'Поражений', 'Очков', 'Лучший результат'].forEach(function (h) {
      hr.appendChild(el('th', null, h));
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el('tbody');
    var st = p.stats || {};
    var keys = Object.keys(st);
    if (!keys.length) {
      var tr = el('tr');
      var td = el('td', null, 'Пока ничего не сыграно.');
      td.colSpan = 6;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    keys.forEach(function (k) {
      var s = st[k];
      var tr = el('tr');
      tr.appendChild(el('td', null, k));
      tr.appendChild(el('td', 'gw-num', s.played));
      tr.appendChild(el('td', 'gw-num', s.wins));
      tr.appendChild(el('td', 'gw-num', s.losses));
      tr.appendChild(el('td', 'gw-num', s.points));
      tr.appendChild(el('td', 'gw-num', s.best));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    panel.appendChild(table);

    var row = el('div', 'gw-row');
    var rename = el('button', 'gw-btn', '✏️ Переименовать игрока');
    rename.addEventListener('click', function () {
      var name = (window.prompt('Имя игрока:', state.current) || '').trim().slice(0, 20);
      if (!name || name === state.current) return;
      if (state.players[name]) { state.current = name; }
      else {
        var old = player();
        state.players[name] = old;      // переносим прогресс на новое имя
        delete state.players[state.current];
        state.current = name;
      }
      save(); updateChrome(); showStats();
    });

    var reset = el('button', 'gw-btn', '🧹 Сбросить прогресс');
    reset.addEventListener('click', function () {
      if (!window.confirm('Обнулить монеты и статистику игрока «' + state.current + '»?')) return;
      state.players[state.current] = newPlayer();
      save(); updateChrome(); showStats();
      toast('Прогресс сброшен, снова ' + START_COINS + ' 🪙');
    });

    row.appendChild(rename);
    row.appendChild(reset);
    panel.appendChild(row);
    viewEl.appendChild(panel);
    updateChrome();
  }

  function showTop() {
    destroyGame();
    clear(viewEl);
    viewEl.appendChild(el('h2', 'gw-title', '🏆 Топ игроков'));
    viewEl.appendChild(el('p', 'gw-desc', 'Локальный рейтинг: все игроки, созданные в этом браузере.'));

    var rows = Object.keys(state.players).map(function (name) {
      var p = state.players[name];
      var points = 0, wins = 0, played = 0;
      Object.keys(p.stats || {}).forEach(function (k) {
        points += p.stats[k].points || 0;
        wins += p.stats[k].wins || 0;
        played += p.stats[k].played || 0;
      });
      return { name: name, coins: p.coins, points: points, wins: wins, played: played };
    }).sort(function (a, b) { return b.points - a.points || b.coins - a.coins; });

    var panel = el('div', 'gw-panel');
    var table = el('table', 'gw-table');
    var hr = el('tr');
    ['#', 'Игрок', '🪙', 'Очки', 'Побед', 'Партий'].forEach(function (h) { hr.appendChild(el('th', null, h)); });
    table.appendChild(hr);
    rows.forEach(function (r, i) {
      var tr = el('tr');
      tr.appendChild(el('td', null, i + 1));
      tr.appendChild(el('td', null, r.name + (r.name === state.current ? ' (вы)' : '')));
      tr.appendChild(el('td', 'gw-num', r.coins));
      tr.appendChild(el('td', 'gw-num', r.points));
      tr.appendChild(el('td', 'gw-num', r.wins));
      tr.appendChild(el('td', 'gw-num', r.played));
      table.appendChild(tr);
    });
    panel.appendChild(table);

    var row = el('div', 'gw-row');
    var add = el('button', 'gw-btn gw-primary', '➕ Новый игрок');
    add.addEventListener('click', function () {
      var name = (window.prompt('Имя нового игрока:', 'Игрок ' + (Object.keys(state.players).length + 1)) || '').trim().slice(0, 20);
      if (!name) return;
      if (!state.players[name]) state.players[name] = newPlayer();
      state.current = name;
      save(); updateChrome(); showTop();
      toast('Игрок «' + name + '» создан, на счету ' + START_COINS + ' 🪙');
    });
    row.appendChild(add);
    panel.appendChild(row);

    viewEl.appendChild(panel);
    updateChrome();
  }

  function showHelp() {
    destroyGame();
    clear(viewEl);
    viewEl.appendChild(el('h2', 'gw-title', '❓ Справка'));

    var list = gameList();
    list.forEach(function (def) {
      var panel = el('div', 'gw-panel');
      panel.appendChild(el('div', 'gw-title', (def.emoji ? def.emoji + ' ' : '') + def.title));
      if (def.rules) {
        var ul = el('ul', 'gw-rules');
        String(def.rules).split('\n').forEach(function (line) {
          line = line.trim();
          if (!line) return;
          ul.appendChild(el('li', null, line.replace(/^[-•*]\s*/, '')));
        });
        panel.appendChild(ul);
      } else if (def.description) {
        panel.appendChild(el('p', 'gw-desc', def.description));
      }
      viewEl.appendChild(panel);
    });

    var common = el('div', 'gw-panel');
    common.appendChild(el('div', 'gw-title', 'Общее'));
    var ul = el('ul', 'gw-rules');
    [
      'Новый игрок получает ' + START_COINS + ' 🪙.',
      'Монеты начисляются за победы и тратятся на ставки и подсказки.',
      'Статистика — по кнопке «📊 Статистика», рейтинг — «🏆 Топ».',
      'Прогресс хранится в localStorage браузера и никуда не отправляется.'
    ].forEach(function (t) { ul.appendChild(el('li', null, t)); });
    common.appendChild(ul);
    viewEl.appendChild(common);
    updateChrome();
  }

  // ---------- навигация ----------

  document.querySelectorAll('[data-nav]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.getAttribute('data-nav');
      if (view === 'menu') showMenu();
      else if (view === 'stats') showStats();
      else if (view === 'top') showTop();
      else if (view === 'help') showHelp();
    });
  });

  playerEl.addEventListener('change', function () {
    var name = (playerEl.value || '').trim().slice(0, 20);
    if (!name) { playerEl.value = state.current; return; }
    if (name === state.current) return;
    if (!state.players[name]) state.players[name] = newPlayer();
    state.current = name;
    save(); updateChrome(); showMenu();
    toast('Игрок: ' + name);
  });

  updateChrome();
  showMenu();
})();

</script>
</body>
</html>
