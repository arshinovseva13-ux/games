<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎮 Игровой зал — веб-версия</title>
  <style>
/* Веб-версия «Игрового зала» — тёмная тема в духе Telegram */
:root {
  --bg: #0e1621;
  --bg-2: #17212b;
  --card: #1c2733;
  --card-2: #22303d;
  --line: #2b3a48;
  --text: #e9eef3;
  --muted: #8b9bab;
  --accent: #5288c1;
  --accent-2: #6ab3f3;
  --good: #4fae6a;
  --bad: #e05555;
  --warn: #e0a33c;
  --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: radial-gradient(1200px 600px at 50% -10%, #1b2b3d 0%, var(--bg) 60%);
  color: var(--text);
  font: 15px/1.5 "Segoe UI", Roboto, Ubuntu, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.gw-app {
  max-width: 980px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

/* ---------- шапка ---------- */
.gw-header {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 16px;
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
}

.gw-logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .2px;
  margin-right: auto;
}

.gw-logo small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}

.gw-nav { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- общие элементы ---------- */
.gw-title { font-size: 19px; font-weight: 700; margin: 0 0 4px; }
.gw-desc { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.gw-muted { color: var(--muted); }
.gw-status { color: var(--muted); font-size: 13px; min-height: 20px; }
.gw-right { margin-left: auto; }

.gw-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0;
}

.gw-btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 9px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: transform .06s ease, background .15s ease, border-color .15s ease;
}
.gw-btn:hover:not(:disabled) { background: #2b3d4d; border-color: #3b556b; }
.gw-btn:active:not(:disabled) { transform: translateY(1px); }
.gw-btn:disabled { opacity: .45; cursor: not-allowed; }

.gw-btn.gw-primary {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-color: #3f6f9e;
  color: #06121d;
  font-weight: 600;
}
.gw-btn.gw-primary:hover:not(:disabled) { filter: brightness(1.07); }

.gw-btn.gw-ghost { background: transparent; }
.gw-btn.gw-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .05); }

.gw-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(82, 136, 193, .16);
  border: 1px solid rgba(82, 136, 193, .45);
  color: var(--accent-2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 600;
}
.gw-badge.gw-badge-good { background: rgba(79, 174, 106, .15); border-color: rgba(79, 174, 106, .45); color: #7fd39a; }
.gw-badge.gw-badge-bad { background: rgba(224, 85, 85, .15); border-color: rgba(224, 85, 85, .45); color: #f08b8b; }

.gw-panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 12px 0;
}

.gw-input, .gw-select {
  background: #101a24;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 8px 10px;
  font: inherit;
  font-size: 14px;
  min-width: 90px;
}
.gw-input:focus, .gw-select:focus { outline: 2px solid rgba(106, 179, 243, .45); outline-offset: 1px; }

/* ---------- меню игр ---------- */
.gw-menu {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.gw-card {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  color: var(--text);
  font: inherit;
  transition: transform .08s ease, border-color .15s ease, background .15s ease;
}
.gw-card:hover { border-color: var(--accent); background: var(--card-2); transform: translateY(-1px); }
.gw-card .gw-card-emoji { font-size: 26px; }
.gw-card .gw-card-title { font-weight: 700; margin-top: 6px; }
.gw-card .gw-card-desc { color: var(--muted); font-size: 12.5px; margin-top: 4px; }

/* ---------- поля игр ---------- */
.gw-grid { display: grid; gap: 6px; margin: 10px 0; }

.gw-cell {
  appearance: none;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  font: inherit;
  font-size: 17px;
  font-weight: 600;
  padding: 10px 6px;
  cursor: pointer;
  min-width: 38px;
  transition: background .12s ease, border-color .12s ease;
}
.gw-cell:hover:not(:disabled) { background: #2b3d4d; }
.gw-cell:disabled { cursor: default; }
.gw-cell.gw-fixed { background: #16202b; color: #cfe0ef; cursor: default; }
.gw-cell.gw-active { border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(106, 179, 243, .35) inset; }
.gw-cell.gw-ok { background: rgba(79, 174, 106, .2); border-color: rgba(79, 174, 106, .5); }
.gw-cell.gw-bad { background: rgba(224, 85, 85, .18); border-color: rgba(224, 85, 85, .55); }
.gw-cell.gw-used { opacity: .35; }

/* ---------- таблицы ---------- */
.gw-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.gw-table th, .gw-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.gw-table th { color: var(--muted); font-weight: 600; }
.gw-table tr:hover td { background: rgba(255, 255, 255, .03); }
.gw-table .gw-num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- тосты ---------- */
.gw-toasts {
  position: fixed;
  right: 16px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 50;
}
.gw-toast {
  background: #22303d;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 10px 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  animation: gw-in .18s ease-out;
  max-width: 320px;
  font-size: 14px;
}
@keyframes gw-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- правила ---------- */
.gw-rules { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
.gw-rules li { margin: 3px 0; }

/* ---------- Память ---------- */
.gw-mem { grid-template-columns: repeat(4, 1fr); max-width: 360px; }
.gw-mem .gw-mem-card { font-size: 24px; padding: 14px 6px; }
.gw-mem .gw-mem-card.gw-mem-open { background: #2b3d4d; border-color: #3b556b; }

/* ---------- 2048 ---------- */
.gw-2048 { grid-template-columns: repeat(4, 1fr); max-width: 360px; gap: 8px; }
.gw-2048 .gw-2048-tile { font-size: 22px; font-weight: 700; padding: 16px 6px; text-align: center; border: none; }

/* ---------- Сапёр ---------- */
.gw-ms { grid-template-columns: repeat(9, 1fr); max-width: 430px; gap: 4px; }
.gw-ms .gw-ms-cell { font-size: 15px; padding: 8px 0; min-width: 30px; }
.gw-ms .gw-ms-cell.gw-ms-open { background: #16202b; cursor: default; }

.gw-footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }

</style>
</head>
<body>
  <div class="gw-app" id="app">
    <header class="gw-header">
      <div class="gw-logo">
        🎮 Игровой зал
        <small>мини-игры в браузере</small>
      </div>
      <div class="gw-nav">
        <span class="gw-badge" id="gw-balance" title="Баланс">🪙 100</span>
        <input class="gw-input" id="gw-player" maxlength="20" title="Имя игрока" placeholder="Игрок">
        <button class="gw-btn gw-ghost" data-nav="menu">🎮 Игры</button>
        <button class="gw-btn gw-ghost" data-nav="stats">📊 Статистика</button>
        <button class="gw-btn gw-ghost" data-nav="top">🏆 Топ</button>
        <button class="gw-btn gw-ghost" data-nav="help">❓ Справка</button>
      </div>
    </header>

    <main id="gw-view"></main>

    <p class="gw-footer">
      Прогресс хранится локально в браузере (localStorage). Обнулить — кнопка в «Статистике».
    </p>
  </div>

  <div class="gw-toasts" id="gw-toasts"></div>

  <!-- игры: каждый файл регистрирует себя в window.Games -->
  <script>
/* ❌⭕ Крестики-нолики.
 * Крестики-нолики — мини-игра для «Игрового зала».
 * Обычный (классический) скрипт: без import/export, без зависимостей,
 * подключается через <script src="tictactoe.js"><\/script> и работает по file://.
 */
(function () {
  'use strict';

  window.Games = window.Games || {};

  var EMPTY = '.';
  var EMPTY_CELL = '▫️';
  var COIN = '🪙';
  var LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],   // строки
    [0, 3, 6], [1, 4, 7], [2, 5, 8],   // столбцы
    [0, 4, 8], [2, 4, 6]               // диагонали
  ];
  // Сложность -> вероятность, что бот сыграет случайный (не оптимальный) ход.
  var LEVELS = {
    easy: { key: 'easy', label: '😊 Новичок', blunder: 0.35 },
    normal: { key: 'normal', label: '🙂 Обычный', blunder: 0.12 },
    hard: { key: 'hard', label: '😈 Невозможный', blunder: 0.0 }
  };
  var LEVEL_ORDER = ['easy', 'normal', 'hard'];
  var MARKS = { X: '❌', O: '⭕' };

  // ------------------------------------------------------------- чистая логика
  function newBoard() {
    return [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY];
  }

  // Вернуть новую доску с поставленной меткой (исходная не мутируется).
  function place(board, index, mark) {
    if (index < 0 || index > 8 || board[index] !== EMPTY) return board;
    var next = board.slice();
    next[index] = mark;
    return next;
  }

  // 'X' | 'O' | 'draw' | null — победитель, ничья или игра идёт.
  function winner(board) {
    for (var i = 0; i < LINES.length; i++) {
      var line = LINES[i];
      if (board[line[0]] !== EMPTY &&
          board[line[0]] === board[line[1]] &&
          board[line[1]] === board[line[2]]) {
        return board[line[0]];
      }
    }
    for (var j = 0; j < board.length; j++) {
      if (board[j] === EMPTY) return null;
    }
    return 'draw';
  }

  // Выигрышная тройка клеток для метки или null.
  function winningLine(board, mark) {
    for (var i = 0; i < LINES.length; i++) {
      var line = LINES[i];
      if (board[line[0]] === mark && board[line[1]] === mark && board[line[2]] === mark) {
        return line;
      }
    }
    return null;
  }

  function freeCells(board) {
    var cells = [];
    for (var i = 0; i < board.length; i++) {
      if (board[i] === EMPTY) cells.push(i);
    }
    return cells;
  }

  function opponent(mark) {
    return mark === 'X' ? 'O' : 'X';
  }

  /* Идеальный ход по минимаксу с альфа-бета отсечениями. None — ходов нет.
   * Оценка: победа mark лучше всего, ничья в середине, поражение хуже.
   * Глубина в оценке заставляет бота выигрывать быстрее и проигрывать позже.
   */
  function bestMove(board, mark) {
    var moves = freeCells(board);
    if (!moves.length) return null;
    var bestScore = null;
    var bestIndex = null;
    for (var i = 0; i < moves.length; i++) {
      var index = moves[i];
      var score = minimax(place(board, index, mark), opponent(mark), mark, 1, -Infinity, Infinity);
      if (bestScore === null || score > bestScore) {
        bestScore = score;
        bestIndex = index;
      }
    }
    return bestIndex;
  }

  // Оценка позиции с точки зрения me. Ход делает turn.
  function minimax(board, turn, me, depth, alpha, beta) {
    var result = winner(board);
    if (result === 'draw') return 0;
    if (result !== null) {
      // me уже победил -> +, соперник победил -> −; раньше = ценнее.
      return result === me ? (10 - depth) : (depth - 10);
    }

    var moves = freeCells(board);
    var value, i, score;
    if (turn === me) {
      value = -Infinity;
      for (i = 0; i < moves.length; i++) {
        score = minimax(place(board, moves[i], turn), opponent(turn), me, depth + 1, alpha, beta);
        if (score > value) value = score;
        if (value > alpha) alpha = value;
        if (alpha >= beta) break; // отсечение: соперник сюда не пойдёт
      }
      return value;
    }
    value = Infinity;
    for (i = 0; i < moves.length; i++) {
      score = minimax(place(board, moves[i], turn), opponent(turn), me, depth + 1, alpha, beta);
      if (score < value) value = score;
      if (value < beta) beta = value;
      if (alpha >= beta) break; // отсечение
    }
    return value;
  }

  // Ход бота с учётом сложности. Возвращает индекс или null.
  function chooseMove(board, mark, level) {
    var empties = freeCells(board);
    if (!empties.length) return null;
    var config = LEVELS[level] || LEVELS.hard;
    if (config.blunder > 0 && Math.random() < config.blunder) {
      return empties[Math.floor(Math.random() * empties.length)];
    }
    return bestMove(board, mark);
  }

  // Человеческое имя клетки: a1…c3.
  function boardName(index) {
    var letters = 'abc';
    return letters.charAt(index % 3) + String(Math.floor(index / 3) + 1);
  }

  // ------------------------------------------------------------------ хелперы DOM
  function elem(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function button(label, className, handler) {
    var node = elem('button', className || 'gw-btn', label);
    node.type = 'button';
    if (typeof handler === 'function') node.addEventListener('click', handler);
    return node;
  }

  function row(children) {
    var box = elem('div', 'gw-row');
    for (var i = 0; i < children.length; i++) box.appendChild(children[i]);
    return box;
  }

  function textPanel(lines, className) {
    var panel = elem('div', className || 'gw-panel');
    for (var i = 0; i < lines.length; i++) panel.appendChild(elem('div', null, lines[i]));
    return panel;
  }

  // ---------------------------------------------------------------------- игра
  var GAME = {
    key: 'tictactoe',
    emoji: '❌',
    title: 'Крестики-нолики',
    description: 'ИИ трёх уровней и режим «на двоих»',
    rules: 'Поле 3×3, вы играете ❌ и ходите первым.\n' +
      'Соберите три своих знака в ряд — по горизонтали, вертикали или диагонали.\n' +
      'Три уровня ИИ: «Новичок» иногда ошибается, «Обычный» ошибается редко, ' +
      '«Невозможный» не проигрывает никогда.\n' +
      'Режим «На двоих»: играйте по очереди на одном экране — один за ❌, второй за ⭕.\n' +
      'Награда за победу над ботом: +15 🪙.',
    mount: mount
  };

  function mount(root, api) {
    if (!root || typeof root.appendChild !== 'function') {
      return { destroy: function () {} };
    }
    api = api || {};

    var view = elem('div', 'gw-panel');
    root.appendChild(view);

    var destroyed = false;
    var timer = null;
    var screen = 'menu';   // 'menu' | 'setup' | 'game'
    var level = 'hard';    // выбранный уровень для игры с ИИ
    var state = null;      // текущая партия
    var rewardGiven = false;

    // ---------------------------------------------------------- мостик к api
    function toast(text) {
      if (typeof api.toast === 'function') api.toast(String(text));
    }
    function giveReward(payload) {
      if (typeof api.reward === 'function') api.reward(payload);
    }
    function goBack() {
      if (typeof api.back === 'function') api.back();
    }
    function balance() {
      if (typeof api.balance !== 'function') return 0;
      try {
        var value = Number(api.balance());
        return isFinite(value) ? value : 0;
      } catch (err) {
        return 0;
      }
    }

    // ---------------------------------------------------------------- рендер
    function clearView() {
      view.textContent = '';
    }

    function renderMenu() {
      screen = 'menu';
      state = null;
      rewardGiven = false;
      clearView();

      view.appendChild(elem('div', 'gw-title', GAME.emoji + ' ' + GAME.title));
      view.appendChild(elem('div', 'gw-desc', 'Выберите режим игры.'));
      view.appendChild(textPanel(GAME.rules.split('\n')));

      view.appendChild(row([button('🤖 Против бота', 'gw-btn gw-primary', function () {
        screen = 'setup';
        renderSetup();
      })]));
      view.appendChild(row([button('👥 На двоих', 'gw-btn', function () {
        startSession('duo', level);
      })]));
      view.appendChild(row([button('↩ В меню', 'gw-btn gw-ghost', goBack)]));
    }

    function renderSetup() {
      screen = 'setup';
      state = null;
      clearView();

      view.appendChild(elem('div', 'gw-title', GAME.emoji + ' ' + GAME.title));
      view.appendChild(elem('div', 'gw-desc', 'Игра против ИИ — выберите уровень сложности:'));

      var select = elem('select', 'gw-select');
      select.setAttribute('aria-label', 'Уровень сложности');
      for (var i = 0; i < LEVEL_ORDER.length; i++) {
        var key = LEVEL_ORDER[i];
        var option = document.createElement('option');
        option.value = key;
        option.textContent = LEVELS[key].label;
        if (key === level) option.selected = true;
        select.appendChild(option);
      }
      select.addEventListener('change', function () { level = select.value; });
      view.appendChild(row([select]));

      view.appendChild(row([
        button('▶️ Начать партию', 'gw-btn gw-primary', function () {
          startSession('bot', select.value || level);
        }),
        button('↩ В меню', 'gw-btn gw-ghost', goBack)
      ]));
      view.appendChild(textPanel(['Сложность можно менять и во время партии.'], 'gw-panel'));
    }

    function startSession(mode, chosenLevel) {
      if (LEVELS[chosenLevel]) level = chosenLevel;
      state = {
        mode: mode,
        level: mode === 'bot' ? level : 'hard',
        board: newBoard(),
        turn: 'X',
        last: null,
        result: null,
        over: false
      };
      rewardGiven = false;
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      screen = 'game';
      renderGame();
    }

    function playerName(mark) {
      return mark === 'X' ? 'Игрок 1' : 'Игрок 2';
    }

    function resultText(session) {
      if (session.result === 'draw') return '🤝 Ничья!';
      if (session.mode === 'bot') {
        return session.result === 'X' ? '🏆 Ты победил! 🤯' : '🤖 Бот победил.';
      }
      return '🏆 Победил ' + MARKS[session.result] + ' ' + playerName(session.result);
    }

    function statusLines(session) {
      var lines = [];
      if (session.mode === 'duo') {
        lines.push('❌ Игрок 1   vs   ⭕ Игрок 2');
        if (session.over) {
          lines.push(resultText(session));
        } else {
          lines.push('Ход: ' + MARKS[session.turn] + ' ' + playerName(session.turn));
        }
      } else {
        lines.push('❌ Игрок   vs   🤖 бот');
        if (session.over) {
          lines.push(resultText(session));
        } else {
          lines.push(session.turn === 'X' ? 'Ход: твой' : 'Ход: бота');
        }
        lines.push('Сложность: ' + LEVELS[session.level].label);
      }
      return lines;
    }

    function rewardCoins(session) {
      if (session.mode !== 'bot') return 0;
      return session.result === 'X' ? 15 : 0;
    }

    function infoLines(session) {
      var lines = [];
      if (session.last) {
        lines.push('Последний ход: ' + MARKS[session.last.mark] + ' ' + boardName(session.last.index));
      }
      if (session.over && session.mode === 'bot') {
        lines.push('Награда: ' + rewardCoins(session) + ' ' + COIN);
        lines.push('Баланс: ' + balance() + ' ' + COIN);
      }
      return lines;
    }

    function buildGrid(session) {
      var grid = elem('div', 'gw-grid');
      var line = (session.over && session.result && session.result !== 'draw')
        ? winningLine(session.board, session.result)
        : null;

      for (var index = 0; index < 9; index++) {
        (function (cellIndex) {
          var mark = session.board[cellIndex];
          var cell = button(MARKS[mark] || EMPTY_CELL, 'gw-cell', function () { onCell(cellIndex); });
          cell.setAttribute('aria-label', 'Клетка ' + boardName(cellIndex) +
            (mark === EMPTY ? ', пусто' : ', ' + mark));

          if (mark !== EMPTY) cell.classList.add('gw-fixed');
          if (line && (line[0] === cellIndex || line[1] === cellIndex || line[2] === cellIndex)) {
            var bad = session.mode === 'bot' && session.result === 'O';
            cell.classList.add(bad ? 'gw-bad' : 'gw-ok');
          }
          var botThinking = session.mode === 'bot' && session.turn === 'O' && !session.over;
          cell.disabled = Boolean(session.over || mark !== EMPTY || botThinking);
          grid.appendChild(cell);
        })(index);
      }
      return grid;
    }

    function renderGame() {
      var session = state;
      if (!session) {
        renderMenu();
        return;
      }
      clearView();

      view.appendChild(elem('div', 'gw-title', GAME.emoji + ' ' + GAME.title));

      var badges = elem('div', 'gw-row');
      badges.appendChild(elem('span', 'gw-badge',
        session.mode === 'duo' ? '👥 На двоих' : '🤖 ' + LEVELS[session.level].label));
      view.appendChild(badges);

      var status = elem('div', 'gw-status');
      var lines = statusLines(session);
      for (var i = 0; i < lines.length; i++) status.appendChild(elem('div', null, lines[i]));
      view.appendChild(status);

      view.appendChild(buildGrid(session));

      var info = infoLines(session);
      if (info.length) view.appendChild(textPanel(info, 'gw-panel'));

      var actions = elem('div', 'gw-row');
      actions.appendChild(button(session.over ? '🔄 Ещё партия' : '🔄 Новая партия',
        'gw-btn gw-primary', restart));
      actions.appendChild(button('↩ В меню', 'gw-btn gw-ghost', goBack));
      view.appendChild(actions);

      if (session.mode === 'bot') {
        var levels = elem('div', 'gw-row');
        for (var k = 0; k < LEVEL_ORDER.length; k++) {
          (function (key) {
            levels.appendChild(button(
              (session.level === key ? '🔸 ' : '') + LEVELS[key].label,
              'gw-btn ' + (session.level === key ? 'gw-primary' : 'gw-ghost'),
              function () { setLevel(key); }
            ));
          })(LEVEL_ORDER[k]);
        }
        view.appendChild(levels);
      }
    }

    // ---------------------------------------------------------------- события
    function onCell(index) {
      var session = state;
      if (!session || session.over) return;
      if (session.board[index] !== EMPTY) {
        toast('Клетка занята');
        return;
      }
      if (session.mode === 'bot' && session.turn !== 'X') {
        toast('Сейчас ход бота');
        return;
      }

      session.board = place(session.board, index, session.turn);
      session.last = { mark: session.turn, index: index };
      toast(MARKS[session.last.mark] + ' → ' + boardName(index));
      session.turn = opponent(session.last.mark);

      if (settle()) {
        renderGame();
        return;
      }
      renderGame();
      if (session.mode === 'bot' && session.turn === 'O') scheduleBot();
    }

    function scheduleBot() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () {
        timer = null;
        if (destroyed) return;
        botTurn();
      }, 350);
    }

    function botTurn() {
      var session = state;
      if (!session || session.over || session.mode !== 'bot' || session.turn !== 'O') return;
      var index = chooseMove(session.board, 'O', session.level);
      if (index === null) return;
      session.board = place(session.board, index, 'O');
      session.last = { mark: 'O', index: index };
      session.turn = opponent('O');
      settle();
      renderGame();
    }

    // Проверить конец партии. true — игра завершена.
    function settle() {
      var session = state;
      var result = winner(session.board);
      if (result === null) return false;
      session.result = result;
      session.over = true;
      payOut(session);
      return true;
    }

    function payOut(session) {
      if (rewardGiven) return;
      rewardGiven = true;
      // В режиме «на двоих» монеты не начисляются: оба игрока за одним экраном.
      if (session.mode !== 'bot') return;
      if (session.result === 'X') {
        giveReward({ coins: 15, win: true, points: 15 });
      } else {
        // Ничья или поражение — засчитываем как не-победу, монет не даём.
        giveReward({ lose: true });
      }
    }

    function setLevel(key) {
      var session = state;
      if (!session || session.mode !== 'bot') return;
      level = key;
      session.level = key;
      resetBoard(session, 'Новая партия');
    }

    function restart() {
      var session = state;
      if (!session) {
        renderMenu();
        return;
      }
      resetBoard(session, 'Новая партия');
    }

    function resetBoard(session, message) {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      session.board = newBoard();
      session.turn = 'X';
      session.last = null;
      session.result = null;
      session.over = false;
      rewardGiven = false;
      screen = 'game';
      toast(message);
      renderGame();
    }

    renderMenu();

    return {
      destroy: function () {
        destroyed = true;
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
        if (view.parentNode) view.parentNode.removeChild(view);
      }
    };
  }

  window.Games.tictactoe = GAME;
})();

      if (state.over) return;

        setStatus('Буква ' + letter + ' уже была 🙃');

        render();

      state.wrong.push(letter);
      var left = MAX_MISTAKES - state.wrong.length;

      setStatus('❌ Буквы ' + letter.toUpperCase() + ' нет. Осталось ошибок: ' + left);

      if (state.over) return;

      var left = MAX_MISTAKES - state.wrong.length;

      if (state.over) return;
      var closed = [];
      var letters = uniqueSorted(state.word.split(''));
      for (var i = 0; i < letters.length; i++) {
        if (!hasLetter(state.guessed, letters[i])) closed.push(letters[i]);
      }
      if (!closed.length) {
        toast('Все буквы уже открыты');
        return;
      }
      var balance = currentBalance();
      if (balance < HINT_COST) {
        toast('Нужно ' + HINT_COST + ' 🪙, у тебя ' + balance);
        return;
      }
      if (call(api.spend, HINT_COST) === false) {
        toast('Нужно ' + HINT_COST + ' 🪙, у тебя ' + currentBalance());
        return;
      }
      var letter = closed[0];
      state.guessed.push(letter);
      state.hints += 1;
      var note = '💡 Куплена буква ' + letter.toUpperCase() + ' (−' + HINT_COST + ' 🪙)';
      render();
      setStatus(note);
      if (isWon(state.word, state.guessed)) finishWin(note);
    }

    function lockBoard() {
      state.over = true;
      inputEl.disabled = true;
      var hintBtn = root.querySelector('[data-act="hint"]');
      if (hintBtn) hintBtn.disabled = true;
      refreshKeyboard();
    }

    function finishWin(note) {
      var word = state.word;
      var hints = state.hints;
      var coins = Math.max(Math.floor(REWARD_WIN / 3), REWARD_WIN - hints * HINT_COST);
      var mistakes = state.wrong.length;
      var points = Math.max(1, MAX_MISTAKES - mistakes);
      lockBoard();
      render();
      call(api.reward, { coins: coins, win: true, points: points });
      setStatus('🎉 Слово угадано: ' + word.toUpperCase() +
        (note ? '\n' + note : '') +
        '\nОшибок: ' + mistakes + ' из ' + MAX_MISTAKES +
        '\nНаграда: ' + coins + ' 🪙   (точек: ' + points + ')' +
        '\nБаланс: ' + currentBalance() + ' 🪙');
      toast('🎉 +' + coins + ' 🪙');
    }

    function finishLose() {
      var word = state.word;
      lockBoard();
      render();
      call(api.reward, { lose: true });
      setStatus('💀 Не угадал.\nСлово было: ' + word.toUpperCase() +
        '\nБаланс: ' + currentBalance() + ' 🪙');
      toast('💀 Слово было: ' + word.toUpperCase());
    }

    buildShell();
    document.addEventListener('keydown', onDocKeyDown);
    newGame();

    return {
      destroy: function () {
        document.removeEventListener('keydown', onDocKeyDown);
        if (inputEl) inputEl.removeEventListener('keydown', onKeyDown);
        root.innerHTML = '';
      }
    };
  }

  var HangmanGame = {
    key: 'hangman',
    emoji: '🪢',
    title: 'Виселица',
    description: '63 слова с подсказками, 7 ошибок, покупка буквы за монеты',
    rules: RULES,
    mount: mount,
    words: WORDS,
    maxMistakes: MAX_MISTAKES,
    hintCost: HINT_COST,
    rewardWin: REWARD_WIN
  };

  window.Games = window.Games || {};
  window.Games.hangman = HangmanGame;
})();

  <script>
/* 🔢 Судоку — мини-игра для «Игрового зала».
 *
 * Классическое судоку 9×9: генерация корректного поля с единственным решением,
 * три сложности, подсказка «открыть клетку» за 20 монет, награда до 70 монет.
 * Обычный скрипт без модулей и зависимостей — работает по file://.
 */
(function () {
  'use strict';

  // ------------------------------------------------------------------ константы
  var SIZE = 9;
  var BOX = 3;
  var EMPTY = 0;
  var DIGITS = [1, 2, 3, 4, 5, 6, 7, 8, 9];
  var ROW_LETTERS = 'ABCDEFGHI';
  var HINT_COST = 20;

  // ключ: [подпись, сколько клеток убираем, награда]
  var DIFFICULTIES = {
    easy: { key: 'easy', label: '😊 Лёгкое', remove: 36, reward: 25 },
    normal: { key: 'normal', label: '🙂 Среднее', remove: 46, reward: 45 },
    hard: { key: 'hard', label: '😈 Сложное', remove: 52, reward: 70 }
  };

  var RULES = [
    'В каждой строке, столбце и квадрате 3×3 должны стоять цифры 1–9 по одному разу.',
    '',
    'Как играть:',
    '1. Нажми клетку — она подсветится.',
    '2. Нажми цифру 1–9 на панели или на клавиатуре.',
    '3. 0 или Backspace — стереть клетку.',
    '',
    'Клетки-условия выделены и не редактируются. Ошибки сразу не подсвечиваются —',
    'как в настоящем судоку. Победа, когда всё поле заполнено верно.',
    'Подсказка «Открыть клетку» стоит 20 🪙.'
  ].join('\n');

  // ------------------------------------------------------------------ чистая логика
  function emptyBoard() {
    var board = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(EMPTY);
      board.push(row);
    }
    return board;
  }

  function clone(board) {
    var copy = [];
    for (var r = 0; r < SIZE; r++) copy.push(board[r].slice());
    return copy;
  }

  function shuffled(list, rng) {
    var items = list.slice();
    for (var i = items.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = items[i];
      items[i] = items[j];
      items[j] = tmp;
    }
    return items;
  }

  // Допустимые цифры для клетки (та же логика, что candidates() в sudoku.py).
  function candidates(board, row, col) {
    var used = {};
    var i, r, c;
    for (i = 0; i < SIZE; i++) {
      used[board[row][i]] = true;
      used[board[i][col]] = true;
    }
    var boxRow = Math.floor(row / BOX) * BOX;
    var boxCol = Math.floor(col / BOX) * BOX;
    for (r = boxRow; r < boxRow + BOX; r++) {
      for (c = boxCol; c < boxCol + BOX; c++) used[board[r][c]] = true;
    }
    var options = [];
    for (i = 0; i < DIGITS.length; i++) {
      if (!used[DIGITS[i]]) options.push(DIGITS[i]);
    }
    return options;
  }

  function uniqueValues(values) {
    var seen = {};
    var filled = 0;
    for (var i = 0; i < values.length; i++) {
      var value = values[i];
      if (value === EMPTY) continue;
      if (seen[value]) return false;
      seen[value] = true;
      filled++;
    }
    return filled >= 0;
  }

  function isConsistent(board) {
    for (var index = 0; index < SIZE; index++) {
      var row = [];
      var column = [];
      var i;
      for (i = 0; i < SIZE; i++) {
        row.push(board[index][i]);
        column.push(board[i][index]);
      }
      if (!uniqueValues(row) || !uniqueValues(column)) return false;
      var boxRow = Math.floor(index / BOX) * BOX;
      var boxCol = (index % BOX) * BOX;
      var box = [];
      for (var r = boxRow; r < boxRow + BOX; r++) {
        for (var c = boxCol; c < boxCol + BOX; c++) box.push(board[r][c]);
      }
      if (!uniqueValues(box)) return false;
    }
    return true;
  }

  // Полная проверка корректности заполненной доски (is_valid в sudoku.py).
  function isValid(board) {
    for (var index = 0; index < SIZE; index++) {
      var row = [];
      var column = [];
      var i;
      for (i = 0; i < SIZE; i++) {
        row.push(board[index][i]);
        column.push(board[i][index]);
      }
      row.sort(function (a, b) { return a - b; });
      column.sort(function (a, b) { return a - b; });
      for (i = 0; i < SIZE; i++) {
        if (row[i] !== DIGITS[i] || column[i] !== DIGITS[i]) return false;
      }
      var boxRow = Math.floor(index / BOX) * BOX;
      var boxCol = (index % BOX) * BOX;
      var box = [];
      for (var r = boxRow; r < boxRow + BOX; r++) {
        for (var c = boxCol; c < boxCol + BOX; c++) box.push(board[r][c]);
      }
      box.sort(function (a, b) { return a - b; });
      for (i = 0; i < SIZE; i++) {
        if (box[i] !== DIGITS[i]) return false;
      }
    }
    return true;
  }

  // Клетка с минимумом вариантов (эвристика MRV) или null.
  function findEmptyMRV(board) {
    var best = null;
    var bestOptions = null;
    for (var row = 0; row < SIZE; row++) {
      for (var col = 0; col < SIZE; col++) {
        if (board[row][col] !== EMPTY) continue;
        var options = candidates(board, row, col);
        if (!options.length) return { row: row, col: col, options: [] };
        if (bestOptions === null || options.length < bestOptions.length) {
          best = { row: row, col: col };
          bestOptions = options;
          if (options.length === 1) return { row: row, col: col, options: options };
        }
      }
    }
    if (best === null) return null;
    return { row: best.row, col: best.col, options: bestOptions };
  }

  // Заполнить доску случайным корректным решением (in-place).
  function fillBoard(board, rng) {
    var spot = findEmptyMRV(board);
    if (spot === null) return true;
    if (!spot.options.length) return false;
    var options = shuffled(spot.options, rng);
    for (var i = 0; i < options.length; i++) {
      board[spot.row][spot.col] = options[i];
      if (fillBoard(board, rng)) return true;
      board[spot.row][spot.col] = EMPTY;
    }
    return false;
  }

  // Сколько решений у доски (не больше limit).
  function countSolutions(board, limit) {
    var total = 0;

    function walk() {
      if (total >= limit) return;
      var spot = findEmptyMRV(board);
      if (spot === null) {
        total += 1;
        return;
      }
      for (var i = 0; i < spot.options.length; i++) {
        board[spot.row][spot.col] = spot.options[i];
        walk();
        board[spot.row][spot.col] = EMPTY;
        if (total >= limit) return;
      }
    }

    walk();
    return total;
  }

  // Сгенерировать пазл с единственным решением: {puzzle, solution}.
  function makePuzzle(remove, rng, unique) {
    if (unique === undefined) unique = true;
    var solution = emptyBoard();
    fillBoard(solution, rng);
    var puzzle = clone(solution);

    var cells = [];
    for (var row = 0; row < SIZE; row++) {
      for (var col = 0; col < SIZE; col++) cells.push([row, col]);
    }
    cells = shuffled(cells, rng);

    var removed = 0;
    for (var i = 0; i < cells.length && removed < remove; i++) {
      var r = cells[i][0];
      var c = cells[i][1];
      var saved = puzzle[r][c];
      puzzle[r][c] = EMPTY;
      if (unique) {
        var probe = clone(puzzle);
        if (countSolutions(probe, 2) !== 1) {
          puzzle[r][c] = saved;
          continue;
        }
      }
      removed += 1;
    }
    return { puzzle: puzzle, solution: solution, removed: removed };
  }

  // Доска заполнена, не противоречит условию и корректна.
  function isSolved(puzzle, board) {
    for (var row = 0; row < SIZE; row++) {
      for (var col = 0; col < SIZE; col++) {
        if (board[row][col] === EMPTY) return false;
        if (puzzle[row][col] !== EMPTY && board[row][col] !== puzzle[row][col]) return false;
      }
    }
    return isValid(board);
  }

  function cellName(row, col) {
    return ROW_LETTERS.charAt(row) + (col + 1);
  }

  function formatTime(seconds) {
    var total = Math.max(0, Math.floor(seconds));
    var minutes = Math.floor(total / 60);
    var rest = total % 60;
    return (minutes < 10 ? '0' : '') + minutes + ':' + (rest < 10 ? '0' : '') + rest;
  }

  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // ------------------------------------------------------------------ игра
  function mount(root, api) {
    api = api || {};
    var balance = typeof api.balance === 'function' ? api.balance : function () { return 0; };
    var spend = typeof api.spend === 'function' ? api.spend : function () { return false; };
    var reward = typeof api.reward === 'function' ? api.reward : function () {};
    var toast = typeof api.toast === 'function' ? api.toast : function () {};

    var rng = Math.random;
    var state = null;      // активная партия
    var finished = false;  // партия завершена (победа)
    var timerId = null;
    var stage = null;      // контейнер текущего экрана
    var destroyed = false;

    // ---------------------------------------------------- служебный каркас
    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function button(text, className, onClick) {
      var node = el('button', className || 'gw-btn', text);
      node.type = 'button';
      node.addEventListener('click', function (event) {
        event.preventDefault();
        if (destroyed) return;

      });
      return node;
    }

    function newStage() {
      root.innerHTML = '';
      stage = el('div');
      root.appendChild(stage);
      return stage;
    }

    function row(parent, className) {
      var node = el('div', className || 'gw-row');
      if (parent) parent.appendChild(node);
      return node;
    }

    function title(parent, text) {
      var node = el('div', 'gw-title', text);
      if (parent) parent.appendChild(node);
      return node;
    }

    function status(parent, text) {
      var node = el('div', 'gw-status', text);
      if (parent) parent.appendChild(node);
      return node;
    }

    function badge(parent, text) {

    function stopTimer() {

    function startTimer() {
      stopTimer();

        if (destroyed || !state || finished) return;
        if (state.timerNode && state.timerNode.parentNode) {
          state.timerNode.textContent = '⏱ ' + formatTime(elapsedSeconds());
        }
      }, 1000);
    }

    function elapsedSeconds() {
      if (!state) return 0;
      return Math.floor((Date.now() - state.startedAt) / 1000);
    }

    function currentBalance() {
      var value = balance();

    }

    // ---------------------------------------------------- экран выбора сложности
    function renderMenu() {
      stopTimer();
      state = null;
      finished = false;
      newStage();

      title(stage, '🔢 Судоку');
      var desc = el('div', 'gw-desc');
      desc.innerHTML = 'Классическое судоку 9×9: выбирай клетку и вводи цифру.<br>' +
        'Поле генерируется с единственным решением. Баланс: <b>' + currentBalance() + ' 🪙</b>';
      stage.appendChild(desc);

      var panel = el('div', 'gw-panel');
      panel.appendChild(el('div', 'gw-desc', 'Выбери сложность:'));
      Object.keys(DIFFICULTIES).forEach(function (key) {

        var node = button(level.label + ' · убрать ' + level.remove + ' клеток',

    function filledCount() {

      for (var row = 0; row < SIZE; row++) {
        for (var col = 0; col < SIZE; col++) {
          if (state.board[row][col] !== EMPTY) total++;
        }
      }
      return total;
    }

    function refreshStatus() {
      if (!state) return;
      if (state.statusNode) {

          '   Заполнено: ' + filledCount() + '/81';

      if (state.hintsNode) {

      }
    }

    // ---------------------------------------------------- отрисовка поля
    function renderBoard(note) {
      if (!state) { renderMenu(); return; }
      newStage();

      title(stage, '🔢 Судоку · ' + state.level.label);
      var desc = el('div', 'gw-desc',
        'Нажми клетку, затем цифру 1–9. Клавиатура тоже работает: 1–9 — цифра, ' +
        '0 или Backspace — стереть, стрелки — перемещение.');
      stage.appendChild(desc);

      if (note) {
        var noteNode = el('div', 'gw-status', note);
        stage.appendChild(noteNode);
      }

      var grid = el('div', 'gw-grid');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(9, 1fr)';
      grid.style.width = '100%';
      grid.style.maxWidth = '414px';
      state.cellNodes = [];

      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          grid.appendChild(buildCell(r, c));
        }
      }
      stage.appendChild(grid);

      // Панель цифр.
      var pad = el('div', 'gw-panel');
      var digitsRow = row(pad);
      for (var d = 1; d <= 9; d++) {
        digitsRow.appendChild(digitButton(d));
      }
      pad.appendChild(digitsRow);

      var eraseRow = row(pad);
      eraseRow.appendChild(button('🧽 Стереть', 'gw-btn gw-ghost', function () { setCell(null, EMPTY, false); }));
      eraseRow.appendChild(button('💡 Открыть клетку (' + HINT_COST + ' 🪙)', 'gw-btn', doHint));
      eraseRow.appendChild(button('✅ Проверить', 'gw-btn', doCheck));
      stage.appendChild(pad);

      // Строка статуса и счётчики.
      state.statusNode = status(stage, 'Выбранная клетка: ' + pickText() +
        '   Заполнено: ' + filledCount() + '/81');

      var info = row(stage);
      state.timerNode = badge(info, '⏱ ' + formatTime(elapsedSeconds()));
      state.hintsNode = badge(info, '💡 Подсказок: ' + state.hints + ' (−' + (state.hints * HINT_COST) + ' 🪙)');
      badge(info, 'Уровень: ' + state.level.label);

      var bottom = row(stage);
      bottom.appendChild(button('🔁 Новое поле', 'gw-btn gw-ghost', function () {
        stopTimer();

        stopTimer();
        back();
      }));

      paintBoard();
    }

    function buildCell(r, c) {
      var fixed = state.puzzle[r][c] !== EMPTY;
      var node = button('', 'gw-cell' + (fixed ? ' gw-fixed' : ''), function () { pickCell(r, c); });
      // Толстые границы квадратов 3×3 и лёгкая шахматная подсветка блоков.

      if ((Math.floor(r / BOX) + Math.floor(c / BOX)) % 2 === 1) node.style.background = 'rgba(148, 163, 184, 0.12)';
      node.style.aspectRatio = '1 / 1';
      node.style.fontSize = 'clamp(13px, 2.6vw, 19px)';
      node.style.padding = '0';
      if (fixed) node.style.fontWeight = '700';
      state.cellNodes.push(node);

    }

    function digitButton(digit) {
      var node = button(String(digit), 'gw-btn', function () { setCell(null, digit, false); });
      node.style.minWidth = '38px';
      node.style.flex = '1 1 38px';
      return node;
    }

    // Перерисовать содержимое клеток и их состояния.
    function paintBoard(marks) {
      if (!state) return;
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          var node = state.cellNodes[r * SIZE + c];
          if (!node) continue;
          var fixed = state.puzzle[r][c] !== EMPTY;
          var value = state.board[r][c];
          node.textContent = value === EMPTY ? '' : String(value);
          node.className = 'gw-cell' + (fixed ? ' gw-fixed' : '');
          if (state.pick && state.pick[0] === r && state.pick[1] === c) {
            node.className += ' gw-active';
          }
          if (marks && marks[r][c] === 1) node.className += ' gw-ok';
          if (marks && marks[r][c] === 2) node.className += ' gw-bad';
        }
      }
    }

    // ---------------------------------------------------- действия
    function pickCell(row, col) {
      if (!state || finished) return;
      if (state.puzzle[row][col] !== EMPTY) {
        toast(cellName(row, col) + ' — клетка-условие, её менять нельзя');
        return;
      }
      state.pick = [row, col];
      paintBoard();
      refreshStatus();
      toast('Выбрана клетка ' + cellName(row, col));
    }

    // cell=null — в выбранную клетку; digit=EMPTY — стереть.
    function setCell(cell, digit, fromHint) {
      if (!state || finished) return;
      var row, col;
      if (cell === null) {
        if (!state.pick) {
          toast('Сначала выбери клетку, например E5');
          return;
        }
        row = state.pick[0];
        col = state.pick[1];
      } else {
        row = cell[0];
        col = cell[1];
      }

      if (state.puzzle[row][col] !== EMPTY) {
        toast(cellName(row, col) + ' — клетка-условие');
        return;
      }

      if (digit === null || digit === undefined) {
        toast('Нужна цифра от 1 до 9 (0 — стереть)');
        return;
      }
      if (digit !== EMPTY && (digit < 1 || digit > 9)) {
        toast('Нужна цифра от 1 до 9 (0 — стереть)');
        return;
      }

      if (digit === EMPTY) {
        if (state.board[row][col] === EMPTY && !fromHint) {
          toast(cellName(row, col) + ' уже пустая');
          return;
        }
        state.board[row][col] = EMPTY;
      } else {
        if (state.board[row][col] === digit) {
          toast('Там уже стоит ' + digit);
          return;
        }
        state.board[row][col] = digit;
      }

      state.moves += 1;
      state.pick = digit ? [row, col] : null;
      if (!fromHint) {
        toast(cellName(row, col) + ' → ' + (digit ? digit : 'пусто'));
      }

      if (isSolved(state.puzzle, state.board)) {
        finishWin();
        return;
      }
      paintBoard();
      refreshStatus();
    }

    function doHint() {
      if (!state || finished) return;
      var board = state.board;

      // Ищем, что открыть: выбранная клетка, иначе первая неверная/пустая.
      var target = null;
      if (state.pick && state.puzzle[state.pick[0]][state.pick[1]] === EMPTY &&
          board[state.pick[0]][state.pick[1]] !== state.solution[state.pick[0]][state.pick[1]]) {
        target = state.pick;
      } else {
        for (var row = 0; row < SIZE && !target; row++) {
          for (var col = 0; col < SIZE; col++) {
            if (state.puzzle[row][col] === EMPTY && board[row][col] !== state.solution[row][col]) {
              target = [row, col];
              break;
            }
          }
        }
      }

      if (!target) {
        toast('Ошибок нет — ты молодец!');
        return;
      }

      if (!spend(HINT_COST)) {
        toast('Нужно ' + HINT_COST + ' 🪙, у тебя ' + currentBalance());
        return;
      }

      var r = target[0];
      var c = target[1];
      var value = state.solution[r][c];
      state.board[r][c] = value;
      state.moves += 1;
      state.hints += 1;
      state.pick = [r, c];
      toast('Открыл ' + cellName(r, c) + ' = ' + value);

      if (isSolved(state.puzzle, state.board)) {
        finishWin();
        return;
      }
      paintBoard();
      refreshStatus();
      if (state.statusNode) {
        state.statusNode.textContent = '💡 Открыта клетка ' + cellName(r, c) +
          ' (−' + HINT_COST + ' 🪙)   Выбранная клетка: ' + pickText() +
          '   Заполнено: ' + filledCount() + '/81';
      }
    }

    function doCheck() {
      if (!state || finished) return;
      var marks = [];
      var errors = 0;
      var empty = 0;
      for (var r = 0; r < SIZE; r++) {
        marks.push([]);
        for (var c = 0; c < SIZE; c++) {
          var value = state.board[r][c];
          if (value === EMPTY) {
            marks[r].push(0);
            empty++;
          } else if (value === state.solution[r][c]) {
            marks[r].push(1);
          } else {
            marks[r].push(2);
            errors++;
          }
        }
      }
      paintBoard(marks);

      if (isSolved(state.puzzle, state.board)) {
        finishWin();
        return;
      }

      var parts = [];
      if (errors) parts.push('ошибок: ' + errors);
      if (empty) parts.push('пустых клеток: ' + empty);
      var text = parts.length ? 'Проверка: ' + parts.join(', ') + '. Ошибки подсвечены красным.' :
        'Всё заполнено верно!';
      if (state.statusNode) state.statusNode.textContent = '✅ ' + text;
      toast(text);

      marks = null;
      window.setTimeout(function () {
        if (destroyed || !state || finished) return;
        paintBoard();
      }, 1600);
    }

    // ---------------------------------------------------- победа
    function finishWin() {
      if (!state || finished) return;
      finished = true;
      stopTimer();

      var coins = state.level.reward;
      var points = Math.max(1, 200 - Math.floor(state.moves / 3));
      var seconds = elapsedSeconds();
      var level = state.level;
      var moves = state.moves;
      var hints = state.hints;
      var puzzle = state.puzzle;
      var solution = state.solution;
      var board = state.board;

      reward({ coins: coins, win: true, lose: false, points: points });
      state = null;

      newStage();
      title(stage, '🎉 Судоку решено!');
      var info = el('div', 'gw-desc');
      info.innerHTML = 'Сложность: <b>' + level.label + '</b><br>' +
        'Ходов: <b>' + moves + '</b> (из них подсказок: ' + hints + ')<br>' +
        'Время: <b>' + formatTime(seconds) + '</b><br>' +
        'Награда: <b>' + coins + ' 🪙</b>, очков: <b>' + points + '</b><br>' +
        'Баланс: <b>' + currentBalance() + ' 🪙</b>';
      stage.appendChild(info);

      stage.appendChild(solutionGrid(puzzle, board, true));

      var bottom = row(stage);
      bottom.appendChild(button('🔁 Новое поле', 'gw-btn gw-primary', function () { renderMenu(); }));
      bottom.appendChild(button('↩ В меню', 'gw-btn', back));

      // Чистим ссылки на завершённую партию, чтобы таймер/ввод ничего не трогали.
      puzzle = null; solution = null; board = null;
      toast('🎉 Судоку решено! Награда: ' + coins + ' 🪙');
    }

    // Статичная сетка для показа решения (read-only).
    function solutionGrid(puzzle, board, highlight) {
      var grid = el('div', 'gw-panel');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(9, 1fr)';
      grid.style.gap = '2px';
      grid.style.maxWidth = '414px';
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          var fixed = puzzle[r][c] !== EMPTY;
          var value = board[r][c] === EMPTY ? '' : String(board[r][c]);
          var node = el('div', 'gw-cell' + (fixed ? ' gw-fixed' : '') + (highlight ? ' gw-ok' : ''), value);
          node.style.display = 'flex';
          node.style.alignItems = 'center';
          node.style.justifyContent = 'center';
          node.style.aspectRatio = '1 / 1';
          if (c % BOX === BOX - 1 && c !== SIZE - 1) node.style.borderRight = '3px solid #64748b';
          if (r % BOX === BOX - 1 && r !== SIZE - 1) node.style.borderBottom = '3px solid #64748b';
          grid.appendChild(node);
        }
      }
      return grid;
    }

    // ---------------------------------------------------- клавиатура
    function onKeyDown(event) {
      if (destroyed || !state || finished) return;
      if (event.ctrlKey || event.altKey || event.metaKey) return;

      var target = event.target;
      var tag = target && target.tagName ? String(target.tagName).toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

      var key = event.key;
      if (key >= '1' && key <= '9') {
        setCell(null, parseInt(key, 10), false);
        event.preventDefault();
        return;
      }
      if (key === '0' || key === 'Backspace' || key === 'Delete' || key === 'Escape') {
        setCell(null, EMPTY, false);
        event.preventDefault();
        return;
      }
      if (key.indexOf('Arrow') === 0) {
        var row = state.pick ? state.pick[0] : 0;
        var col = state.pick ? state.pick[1] : -1;
        if (key === 'ArrowUp') row = (row + SIZE - 1) % SIZE;
        if (key === 'ArrowDown') row = (row + 1) % SIZE;
        if (key === 'ArrowLeft') col = (col + SIZE - 1) % SIZE;
        if (key === 'ArrowRight') col = (col + 1) % SIZE;
        if (col < 0) col = 0;
        if (state.puzzle[row][col] === EMPTY) {
          state.pick = [row, col];
          paintBoard();
          refreshStatus();
        }
        event.preventDefault();
      }
    }

    document.addEventListener('keydown', onKeyDown);

    // ---------------------------------------------------- старт
    renderMenu();

    return {
      destroy: function () {
        destroyed = true;
        stopTimer();
        document.removeEventListener('keydown', onKeyDown);
        state = null;
        root.innerHTML = '';
      }
    };
  }

  // ------------------------------------------------------------------ регистрация
  window.Games = window.Games || {};
  window.Games.sudoku = {
    key: 'sudoku',
    emoji: '🔢',
    title: 'Судоку',
    description: 'Классическое судоку 9×9: выбирай клетку кнопкой и вводи цифру.',
    rules: RULES,
    mount: mount
  };
})();

  <script>
/* ✊ Камень-ножницы-бумага.
 * Камень-ножницы-бумага — мини-игра для «Игрового зала».
 * Обычный (классический) скрипт: без import/export, без зависимостей,
 * подключается через <script src="rps.js"><\/script> и работает по file://.
 */
(function () {
  'use strict';

  window.Games = window.Games || {};

  var COIN = '🪙';
  var TARGET = 3; // серия до 3 побед

  var MOVES = {
    r: { emoji: '✊', name: 'Камень' },
    s: { emoji: '✌️', name: 'Ножницы' },
    p: { emoji: '✋', name: 'Бумага' }
  };
  var MOVE_KEYS = ['r', 's', 'p'];
  var BEATS = { r: 's', s: 'p', p: 'r' };       // ключ бьёт значение
  var COUNTER = { r: 'p', s: 'r', p: 's' };     // что бьёт наш предыдущий ход игрока
  var RESULT_LABEL = {
    win: 'ты выиграл раунд ✅',
    lose: 'раунд за ботом ❌',
    draw: 'ничья 🤝'
  };
  var RESULT_TOAST = { win: 'Раунд твой!', lose: 'Раунд бота', draw: 'Ничья' };

  // ------------------------------------------------------------- чистая логика
  // 'win' | 'lose' | 'draw' с точки зрения игрока.
  function duel(player, bot) {
    if (player === bot) return 'draw';
    return BEATS[player] === bot ? 'win' : 'lose';
  }

  /* Бот слегка подстраивается: чаще играет то, что бьёт частый ход игрока.
   * Как в исходнике: веса 1.0 + count(move) * 0.5, затем контр-ход с шансом 0.7.
   */
  function pickBotMove(history) {
    if (history && history.length) {
      var weights = [1.0, 1.0, 1.0];
      for (var i = 0; i < MOVE_KEYS.length; i++) {
        weights[i] += countOf(history, MOVE_KEYS[i]) * 0.5;
      }
      var likelyPlayerMove = weightedPick(MOVE_KEYS, weights);
      if (Math.random() < 0.7) return COUNTER[likelyPlayerMove];
      return MOVE_KEYS[Math.floor(Math.random() * MOVE_KEYS.length)];
    }
    return MOVE_KEYS[Math.floor(Math.random() * MOVE_KEYS.length)];
  }

  function countOf(list, value) {
    var total = 0;
    for (var i = 0; i < list.length; i++) {
      if (list[i] === value) total += 1;
    }
    return total;
  }

  function weightedPick(keys, weights) {
    var total = 0;
    var i;
    for (i = 0; i < weights.length; i++) total += weights[i];
    var roll = Math.random() * total;
    for (i = 0; i < keys.length; i++) {
      roll -= weights[i];
      if (roll <= 0) return keys[i];
    }
    return keys[keys.length - 1];
  }

  // ------------------------------------------------------------------ хелперы DOM
  function elem(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function button(label, className, handler) {
    var node = elem('button', className || 'gw-btn', label);
    node.type = 'button';
    if (typeof handler === 'function') node.addEventListener('click', handler);
    return node;
  }

  function row(children) {
    var box = elem('div', 'gw-row');
    for (var i = 0; i < children.length; i++) box.appendChild(children[i]);
    return box;
  }

  function textPanel(lines, className) {
    var panel = elem('div', className || 'gw-panel');
    for (var i = 0; i < lines.length; i++) panel.appendChild(elem('div', null, lines[i]));
    return panel;
  }

  function moveLabel(key) {
    return MOVES[key].emoji + ' ' + MOVES[key].name;
  }

  // ---------------------------------------------------------------------- игра
  var GAME = {
    key: 'rps',
    emoji: '✊',
    title: 'Камень-ножницы-бумага',
    description: 'Серия до 3 побед; бот подстраивается под ваши ходы',
    rules: 'Играем до 3 побед.\n' +
      'Бот запоминает ваши ходы и иногда подстраивается — не будьте предсказуемы 😉\n' +
      'Раунд: ✊ бьёт ✌️, ✌️ бьёт ✋, ✋ бьёт ✊. Ничья — раунд переигрывается.\n' +
      'Победа в серии: +40 🪙.',
    mount: mount
  };

  function mount(root, api) {
    if (!root || typeof root.appendChild !== 'function') {
      return { destroy: function () {} };
    }
    api = api || {};

    var view = elem('div', 'gw-panel');
    root.appendChild(view);

    var state = null;
    var rewardGiven = false;

    // ---------------------------------------------------------- мостик к api
    function toast(text) {
      if (typeof api.toast === 'function') api.toast(String(text));
    }
    function giveReward(payload) {
      if (typeof api.reward === 'function') api.reward(payload);
    }
    function goBack() {
      if (typeof api.back === 'function') api.back();
    }
    function balance() {
      if (typeof api.balance !== 'function') return 0;
      try {
        var value = Number(api.balance());
        return isFinite(value) ? value : 0;
      } catch (err) {
        return 0;
      }
    }

    // ---------------------------------------------------------------- рендер
    function clearView() {
      view.textContent = '';
    }

    function newSeries() {
      state = {
        wins: 0,
        losses: 0,
        draws: 0,
        history: [],      // ходы игрока
        botHistory: [],   // ходы бота (для истории раундов)
        results: [],      // 'win' | 'lose' | 'draw' по раундам
        rounds: 0,
        last: null,
        over: false,
        won: false,
        quit: false
      };
      rewardGiven = false;
      render();
    }

    function roundNote(last) {
      return MOVES[last.player].emoji + ' ты — ' + MOVES[last.bot].emoji + ' бот: ' +
        RESULT_LABEL[last.result];
    }

    function coinsFor(won) {
      return won ? 40 : 0;
    }

    function render() {
      clearView();
      if (!state) {
        newSeries();
        return;
      }
      var session = state;

      view.appendChild(elem('div', 'gw-title', GAME.emoji + ' ' + GAME.title));
      view.appendChild(elem('div', 'gw-desc', GAME.description));

      if (session.quit) {
        view.appendChild(elem('div', 'gw-status', '✊ Серия прервана.'));
        view.appendChild(row([
          button('▶️ Новая серия', 'gw-btn gw-primary', newSeries),
          button('↩ В меню', 'gw-btn gw-ghost', goBack)
        ]));
        return;
      }

      var badges = elem('div', 'gw-row');
      badges.appendChild(elem('span', 'gw-badge', 'Серия до ' + TARGET + ' побед'));
      view.appendChild(badges);

      var panel = elem('div', 'gw-panel');
      panel.appendChild(elem('div', 'gw-status',
        'Счёт — ты ' + session.wins + ' : ' + session.losses + ' бот (ничьих: ' + session.draws + ')'));
      panel.appendChild(elem('div', 'gw-status',
        'До победы осталось выиграть: ' + Math.max(0, TARGET - session.wins)));
      if (session.last && !session.over) {
        panel.appendChild(elem('div', 'gw-status', roundNote(session.last)));
      }
      view.appendChild(panel);

      if (session.over) {
        var finish = elem('div', 'gw-panel');
        finish.appendChild(elem('div', 'gw-status',
          session.won ? '🏆 Серия твоя!' : '🤖 Серия за ботом.'));
        if (session.last) finish.appendChild(elem('div', 'gw-status', roundNote(session.last)));
        finish.appendChild(elem('div', 'gw-status',
          'Итог: ты ' + session.wins + ' : ' + session.losses + ' бот, ничьих ' + session.draws));
        finish.appendChild(elem('div', 'gw-status',
          'Награда: ' + coinsFor(session.won) + ' ' + COIN));
        finish.appendChild(elem('div', 'gw-status', 'Баланс: ' + balance() + ' ' + COIN));
        view.appendChild(finish);
      }

      var movesRow = elem('div', 'gw-row');
      for (var i = 0; i < MOVE_KEYS.length; i++) {
        (function (key) {
          var node = button(moveLabel(key), 'gw-btn', function () { play(key); });
          node.disabled = Boolean(session.over);
          movesRow.appendChild(node);
        })(MOVE_KEYS[i]);
      }
      view.appendChild(movesRow);

      var actions = elem('div', 'gw-row');
      if (!session.over) {
        actions.appendChild(button('🏳️ Сдаться', 'gw-btn gw-ghost', quitSeries));
      }
      actions.appendChild(button('🔄 Новая серия', 'gw-btn gw-ghost', newSeries));
      actions.appendChild(button('↩ В меню', 'gw-btn gw-ghost', goBack));
      view.appendChild(actions);

      if (session.results.length) {
        var history = elem('div', 'gw-panel');
        history.appendChild(elem('div', 'gw-desc', 'История ходов:'));
        var historyRow = elem('div', 'gw-row');
        for (var r = 0; r < session.results.length; r++) {
          var result = session.results[r];
          var mark = 'gw-badge' +
            (result === 'win' ? ' gw-ok' : (result === 'lose' ? ' gw-bad' : ''));
          historyRow.appendChild(elem('span', mark,
            MOVES[session.history[r]].emoji + MOVES[session.botHistory[r]].emoji));
        }
        history.appendChild(historyRow);
        view.appendChild(history);
      }
    }

    // ---------------------------------------------------------------- события
    function play(player) {
      var session = state;
      if (!session || session.over || session.quit) return;

      var bot = pickBotMove(session.history);
      session.history.push(player);
      session.botHistory.push(bot);
      session.rounds += 1;

      var result = duel(player, bot);
      if (result === 'win') {
        session.wins += 1;
      } else if (result === 'lose') {
        session.losses += 1;
      } else {
        session.draws += 1;
      }
      session.results.push(result);
      session.last = { player: player, bot: bot, result: result };
      toast(RESULT_TOAST[result]);

      if (session.wins >= TARGET || session.losses >= TARGET) {
        finishSeries(session.wins >= TARGET);
        return;
      }
      render();
    }

    function finishSeries(won) {
      var session = state;
      session.over = true;
      session.won = Boolean(won);
      if (!rewardGiven) {
        rewardGiven = true;
        if (session.won) {
          giveReward({ coins: 40, win: true, points: 40 });
        } else {
          giveReward({ lose: true });
        }
      }
      render();
    }

    function quitSeries() {
      var session = state;
      if (!session) return;
      session.over = true;
      session.quit = true;
      toast('Серия прервана');
      render();
    }

    newSeries();

    return {
      destroy: function () {
        if (view.parentNode) view.parentNode.removeChild(view);
      }
    };
  }

  window.Games.rps = GAME;
})();

  <script>
/* 🎯 Угадай число — мини-игра для «Игрового зала».
 *
 * Классический скрипт: без import/export, без зависимостей, работает по file://.
 * Регистрируется как window.Games.guess и монтируется в переданный root.
 *
 * Логика перенесена один в один из guess.py: три диапазона с лимитом попыток,
 * подсказки «больше/меньше», награда зависит от того, как быстро угадали.
 */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ данные (из guess.py) */

  // подпись, верхняя граница, лимит попыток, награда за победу
  var RANGES = [
    { label: '1–50', top: 50, limit: 12, base: 20 },
    { label: '1–100', top: 100, limit: 16, base: 30 },
    { label: '1–1000', top: 1000, limit: 24, base: 55 }
  ];
  var DEFAULT_RANGE = RANGES[1];
  var MAX_HISTORY_ROWS = 24;

  var RULES = [
    'Выбери диапазон — я загадаю число в нём.',
    'Вводи свои варианты в поле, я подскажу «больше» или «меньше».',
    'Чем меньше попыток потратил, тем больше 🪙 (до 55 за диапазон 1–1000).',
    '',
    'Выход — кнопка «↩ В меню».'
  ].join('\n');

  /* ------------------------------------------------------------------ чистая логика */

  /** Сравнение: 'low' | 'high' | 'hit'. Как check_guess() в guess.py. */
  function checkGuess(secret, guess) {
    if (guess === secret) return 'hit';
    return guess < secret ? 'low' : 'high';
  }

  /** Награда: чем быстрее угадал, тем больше (минимум 1/4 базы). Как reward_for(). */
  function rewardFor(limit, tries, base) {
    var leftover = Math.max(0, limit - tries);
    return Math.max(Math.floor(base / 4), Math.floor(base / 2) + leftover * 2);
  }

  /** Округление как в Python (half-to-even) — для progress() из engine/ui.py. */
  function pyRound(value) {
    var floor = Math.floor(value);
    var diff = value - floor;
    if (diff > 0.5) return floor + 1;
    if (diff < 0.5) return floor;
    return (floor % 2 === 0) ? floor : floor + 1;
  }

  /** Полоска «▰▰▱▱» как ui.progress(done, total). */
  function progress(done, total, width) {
    width = width || 10;

        inputEl.focus();
      }
    }

    setStatus('Выбери диапазон — и я загадаю число.');
    renderPicker();

    return {
      destroy: function () {
        game = null;
        root.innerHTML = '';
      }
    };
  }

(function () {

      var lines = [];

        lines.push('Выигрыш: ' + win + ' 🪙 (чистыми ' + signed(win - paidBet) + ')');
      } else if (win === paidBet) {
        lines.push('🤝 Пара символов — ставка вернулась.');
      } else if (win) {
        lines.push('🙂 Пара символов, но мелкая: ' + win + ' 🪙 (чистыми ' + signed(win - paidBet) + ')');
      } else {
        lines.push('😢 Пусто. Ставка потеряна: −' + paidBet);
      }
      lines.push('Баланс: ' + currentBalance() + ' 🪙');

      history.unshift({ reels: result.slice(0), bet: paidBet, win: win });
      if (history.length > MAX_HISTORY) history.pop();

      if (win > paidBet) toast('🎉 Три в ряд! +' + win + ' 🪙');
      else if (!win) toast('Пусто');

      render();
      setResult(lines);

      if (currentBalance() < MIN_BET) {
        broke = true;
        setStatus('💸 Монеты кончились. В играх без ставок их можно отыграть.');
        render();
        return;
      }
      setStatus('Крути ещё — ставка ' + paidBet + ' 🪙.');
      render();
    }

    buildShell();
    renderReels();
    setStatus('Выбери ставку и крути барабаны.');
    render();

    return {
      destroy: function () {
        clearTimers();
        root.innerHTML = '';
      }
    };
  }

/* 🧠 Память — найди все пары.
 *
 * Классический скрипт: без import/export, без зависимостей, работает по file://.

  'use strict';

  var EMOJI = ['🍎', '🍌', '🍇', '🍒', '🍓', '🍉', '🍋', '🥝'];
  var PAIRS = EMOJI.length;

  var RULES = [
    'На поле лежат карточки рубашкой вверх.',
    'Открывай по две: если символы совпали — пара остаётся открытой.',
    'Цель — собрать все ' + PAIRS + ' пар.',
    'Чем меньше ходов, тем больше монет.'

    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function call(fn, arg) {
    if (typeof fn === 'function') {
      try { return fn(arg); } catch (err) { return undefined; }
    }
    return undefined;
  }

    var arr = list.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function mount(root, api) {
    api = api || {};
    root = root || document.body;
    root.innerHTML = '';

    var deck = [];
    var first = null;
    var second = null;
    var lock = false;
    var moves = 0;
    var found = 0;
    var over = false;
    var timer = null;

    var counterEl, statusEl, grid;

    function buildShell() {
      root.appendChild(el('div', 'gw-title', '🧠 Память'));
      root.appendChild(el('div', 'gw-desc', 'Открывай по две карточки и запоминай, где что лежит.'));

      var row = el('div', 'gw-row');
      counterEl = el('span', 'gw-badge', '');
      row.appendChild(counterEl);

      var newBtn = el('button', 'gw-btn gw-primary', '🔁 Новая игра');
      newBtn.type = 'button';
      newBtn.addEventListener('click', newGame);
      row.appendChild(newBtn);

      var back = el('button', 'gw-btn gw-ghost', '↩ В меню');
      back.type = 'button';
      back.addEventListener('click', function () { call(api.back); });
      row.appendChild(back);
      root.appendChild(row);

      grid = el('div', 'gw-grid gw-mem');

      statusEl = el('div', 'gw-status', '');
      root.appendChild(statusEl);

      root.appendChild(el('div', 'gw-desc', RULES));

      if (timer) { clearTimeout(timer); timer = null; }
      first = second = null;
      lock = false;
      moves = 0;
      found = 0;
      over = false;
      deck = shuffled(EMOJI.concat(EMOJI));

      grid.innerHTML = '';
      for (var i = 0; i < deck.length; i++) {
        (function (idx) {
          var card = el('button', 'gw-cell gw-mem-card', '?');
          card.type = 'button';

      if (first && first.idx === idx) return;

      card.textContent = deck[idx];

      if (!first) {
        first = { idx: idx, card: card };

      }
      second = { idx: idx, card: card };
      moves += 1;

      if (deck[first.idx] === deck[second.idx]) {
        found += 1;
        first.card.classList.add('gw-ok');
        second.card.classList.add('gw-ok');
        first.card.disabled = true;
        second.card.disabled = true;
        first = second = null;
        render();
        if (found === PAIRS) finishWin();
        return;
      }

      lock = true;
      var a = first;
      var b = second;
      render();
      timer = setTimeout(function () {
        hide(a.card);

        first = second = null;

        timer = null;

    }

      card.classList.remove('gw-mem-open');

    buildShell();
    newGame();

    return {
      destroy: function () {

        root.innerHTML = '';
      }
    };

  window.Games = window.Games || {};
  window.Games.memory = {
    key: 'memory',
    emoji: '🧠',

    mount: mount

})();

    'Цель — собрать плитку ' + WIN + '. Ходов больше нет — партия окончена.'
  ].join('\n');

  var KEYMAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    'ф': 'left', 'в': 'right', 'ц': 'up', 'ы': 'down'
  };

  var TILE_COLORS = {
    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f',
    64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850',
    1024: '#edc53f', 2048: '#edc22e'
  };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function call(fn, arg) {
    if (typeof fn === 'function') {
      try { return fn(arg); } catch (err) { return undefined; }
    }
    return undefined;
  }

  function mount(root, api) {
    api = api || {};
    root = root || document.body;
    root.innerHTML = '';

    var board = [];
    var score = 0;
    var won = false;
    var over = false;

    var scoreEl, statusEl, grid;

    function reset() {
      board = [];
      for (var i = 0; i < SIZE * SIZE; i++) board.push(0);
      score = 0;
      won = false;
      over = false;
      addRandom();
      addRandom();
      render();
      statusEl.textContent = 'Собирай плитки одинакового номинала.';
    }

    function emptyCells() {
      var out = [];
      for (var i = 0; i < board.length; i++) if (board[i] === 0) out.push(i);
      return out;
    }

    function addRandom() {
      var cells = emptyCells();
      if (!cells.length) return;
      var idx = cells[Math.floor(Math.random() * cells.length)];
      board[idx] = Math.random() < 0.9 ? 2 : 4;
    }

    function maxTile() {
      var m = 0;
      for (var i = 0; i < board.length; i++) if (board[i] > m) m = board[i];
      return m;
    }

    function lineIndex(dir, i, j) {
      if (dir === 'left') return i * SIZE + j;
      if (dir === 'right') return i * SIZE + (SIZE - 1 - j);
      if (dir === 'up') return j * SIZE + i;
      return (SIZE - 1 - j) * SIZE + i; // down
    }

    function squeeze(line) {
      var vals = [];
      for (var i = 0; i < line.length; i++) if (line[i] !== 0) vals.push(line[i]);
      var out = [];
      var gained = 0;
      for (var k = 0; k < vals.length; k++) {
        if (k + 1 < vals.length && vals[k] === vals[k + 1]) {
          out.push(vals[k] * 2);
          gained += vals[k] * 2;
          k += 1;
        } else {
          out.push(vals[k]);
        }
      }
      while (out.length < SIZE) out.push(0);
      return { line: out, gained: gained };
    }

    function move(dir) {
      var changed = false;
      var gained = 0;
      for (var i = 0; i < SIZE; i++) {
        var line = [];
        for (var j = 0; j < SIZE; j++) line.push(board[lineIndex(dir, i, j)]);
        var res = squeeze(line);
        gained += res.gained;
        for (var j2 = 0; j2 < SIZE; j2++) {
          if (line[j2] !== res.line[j2]) changed = true;
          board[lineIndex(dir, i, j2)] = res.line[j2];
        }
      }
      if (changed) score += gained;
      return changed;
    }

    function canMove() {
      if (emptyCells().length) return true;
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          var v = board[r * SIZE + c];
          if (c + 1 < SIZE && board[r * SIZE + c + 1] === v) return true;
          if (r + 1 < SIZE && board[(r + 1) * SIZE + c] === v) return true;
        }
      }
      return false;
    }

    function step(dir) {
      if (over) return;
      if (!move(dir)) return;
      addRandom();
      render();
      if (!won && maxTile() >= WIN) {
        won = true;
        statusEl.textContent = '🎉 Плитка ' + WIN + ' собрана! Можно продолжать.';
        call(api.toast, '🎉 ' + WIN + '! Можно играть дальше');
      }
      if (!canMove()) finish();
    }

    function finish() {
      over = true;
      var coins = Math.max(5, Math.round(score / 40));
      var points = Math.max(0, Math.round(score / 10));
      call(api.reward, { coins: coins, win: won, lose: !won, points: points });
      statusEl.textContent = (won ? '🏆 Ходов больше нет. Итог: ' : '💀 Ходов больше нет. Итог: ') +
        score + ' очков. Награда: ' + coins + ' 🪙';
      call(api.toast, (won ? '🏆 +' : '💀 +') + coins + ' 🪙');
    }

    function render() {
      scoreEl.textContent = 'Очки: ' + score;
      grid.innerHTML = '';
      for (var i = 0; i < board.length; i++) {
        var v = board[i];
        var cell = el('button', 'gw-cell gw-2048-tile', v ? String(v) : '');
        cell.type = 'button';
        cell.disabled = true;
        cell.style.background = v ? (TILE_COLORS[v] || '#3c3a32') : '#2b3d4d';
        cell.style.color = v && v > 4 ? '#f9f6f2' : (v ? '#776e65' : 'transparent');
        grid.appendChild(cell);
      }
    }

    function onKey(event) {
      var key = event.key;
      var dir = KEYMAP[key] || KEYMAP[String(key).toLowerCase()];
      if (!dir) return;
      event.preventDefault();
      step(dir);
    }

    function buildShell() {
      root.appendChild(el('div', 'gw-title', '🧩 2048'));
      root.appendChild(el('div', 'gw-desc', 'Сдвигай плитки и объединяй одинаковые числа.'));

      var row = el('div', 'gw-row');
      scoreEl = el('span', 'gw-badge', 'Очки: 0');
      row.appendChild(scoreEl);

      var newBtn = el('button', 'gw-btn gw-primary', '🔁 Новая игра');
      newBtn.type = 'button';
      newBtn.addEventListener('click', reset);
      row.appendChild(newBtn);

      var back = el('button', 'gw-btn gw-ghost', '↩ В меню');
      back.type = 'button';
      back.addEventListener('click', function () { call(api.back); });
      row.appendChild(back);
      root.appendChild(row);

      grid = el('div', 'gw-grid gw-2048');
      root.appendChild(grid);

      var pad = el('div', 'gw-row');
      [['↑', 'up'], ['←', 'left'], ['↓', 'down'], ['→', 'right']].forEach(function (pair) {
        var b = el('button', 'gw-btn', pair[0]);
        b.type = 'button';
        b.setAttribute('aria-label', pair[1]);
        b.addEventListener('click', function () { step(pair[1]); });
        pad.appendChild(b);
      });
      root.appendChild(pad);

      statusEl = el('div', 'gw-status', '');
      root.appendChild(statusEl);

      root.appendChild(el('div', 'gw-desc', RULES));
    }

    buildShell();
    reset();
    document.addEventListener('keydown', onKey);

    return {
      destroy: function () {
        document.removeEventListener('keydown', onKey);
        root.innerHTML = '';
      }
    };
  }

  window.Games = window.Games || {};
  window.Games.g2048 = {
    key: 'g2048',
    emoji: '🧩',
    title: '2048',
    description: 'Соединяй плитки и доберись до 2048',
    rules: RULES,
    mount: mount
  };
})();
